<script type="text/plain" id="d1" data-title="1. 系统分层架构">
flowchart TB
    subgraph FE["前端（Next.js App Router）"]
        PAGES["九个页面<br/>login / dashboard / jobs / resumes / resume-detail<br/>applications / reminders / job-sources / discovery"]
        CLIENT["src/lib/client.ts<br/>统一 fetch：信封解析 · 401 自动刷新重试 · waitForTask 轮询"]
        PAGES --> CLIENT
    end
    subgraph API["API 路由层 src/app/api/v1/**（35 个 route，薄控制器）"]
        DEFINE["defineRoute 管线<br/>JWT 鉴权 → Zod 校验 → 业务编排 → 错误码映射"]
    end
    subgraph CORE["领域服务层 src/server/core/**"]
        AUTH["auth-service<br/>JWT + 刷新轮换"]
        RESUME["resume-service"]
        JOB["job-service"]
        MATCH["match-service<br/>match-scorer 五维评分"]
        APP["application-service<br/>投递状态机"]
        POLICY["policy-engine / policy-service"]
        RECO["recommendation-service<br/>五桶分桶"]
        OTHER["user / reminder / dashboard / file-parser"]
    end
    subgraph INFRA["基础设施层"]
        DB[("SQLite（Drizzle ORM）<br/>20 张表，生产可迁 PostgreSQL")]
        subgraph AI["server/ai —— AI 编排"]
            RUNNER["runner.ts<br/>ai_tasks 状态机<br/>queued→running→succeeded/failed"]
            GW["gateway.ts<br/>日限额 · 用量计量"]
            PROV["providers/<br/>Mock（离线确定性）｜OpenAI 兼容（GLM/DeepSeek）"]
        end
        subgraph JS["server/job-sources —— 职位来源适配"]
            REG["registry / site-catalog"]
            NORM["normalizer（规范化+SHA-256 指纹）"]
            DEDUP["deduplicator（三级去重）"]
            ADP["adapters：mock｜boss｜liepin｜zhilian｜lagou｜job51（辅助导入）"]
        end
        subgraph AG["server/agent —— 投递 Agent"]
            FLOW["apply-flow.ts（Level 1 半自动）"]
            DRV["drivers/MockBrowserDriver<br/>（BrowserDriver 抽象，登录墙/验证码即停）"]
            EVT["events.ts → agent_events 审计"]
        end
    end
    CLIENT -->|"fetch /api/v1/**"| DEFINE
    DEFINE --> CORE
    CORE --> DB
    CORE -->|"异步 AI 任务"| RUNNER
    RUNNER --> GW --> PROV
    DEFINE -->|"导入"| ADP
    ADP --> NORM --> DEDUP
    REG --> ADP
    DEDUP -->|"NEW/EXACT/POSSIBLE"| JOB
    MATCH -->|"评分"| RECO
    DEFINE -->|"Agent 运行"| FLOW
    FLOW --> DRV
    FLOW --> EVT
    FLOW -->|"门禁"| POLICY
    FLOW -->|"生成打招呼语"| GW
</script>

<script type="text/plain" id="d4" data-title="4. 认证流程（时序）">
sequenceDiagram
    participant B as 浏览器 lib/client.ts
    participant A as /api/v1/auth/*
    participant D as SQLite
    B->>A: POST /login（email + password）
    A->>A: bcrypt 校验
    A->>D: 写 refresh_tokens（存 sha256，明文不入库）
    A-->>B: Set-Cookie jh_access（15min）+ jh_refresh（30 天）
    B->>A: 业务请求（带 jh_access）
    alt access 有效
        A-->>B: 200 信封 {code, data}
    else access 过期
        A-->>B: 401
        B->>A: POST /refresh（带 jh_refresh）
        A->>D: 校验哈希 → 轮换（旧令牌吊销，发新对）
        A-->>B: 新 jh_access + 新 jh_refresh
        B->>A: 重放原业务请求
        A-->>B: 200
    end
    B->>A: POST /logout
    A->>D: 吊销 refresh_tokens
    A-->>B: 清 Cookie
</script>

<script type="text/plain" id="d5" data-title="5. AI 异步任务流程">
flowchart TB
    A["页面发起<br/>POST /jobs/parse 等业务路由"] --> B["领域服务校验入参<br/>创建 ai_tasks：status=queued"]
    B --> C["进程内执行器 runner<br/>认领任务 → status=running"]
    C --> D["组装 Prompt（prompts.ts）<br/>调 gateway.generateText"]
    D --> E{"gateway 前置检查"}
    E -->|"超日限额 AI_DAILY_LIMIT"| F["任务失败 status=failed<br/>业务侧降级（如打招呼语回退模板）"]
    E -->|"放行"| G{"Provider"}
    G -->|"Mock（默认，离线确定性）"| H["返回结构化 JSON"]
    G -->|"OpenAI 兼容（GLM/DeepSeek）"| H
    H --> I["stripCodeFence + JSON.parse<br/>非法/空响应 → failed 或降级"]
    I --> J["status=succeeded，output 入库"]
    J --> K["前端 waitForTask 轮询<br/>GET /ai-tasks/:id"]
    K --> L{"终态?"}
    L -->|"succeeded"| M["页面取 output.data<br/>解析结果确认后入库"]
    L -->|"failed"| N["页面提示，可重试"]
</script>

<script type="text/plain" id="d6" data-title="6. 职位导入与去重流程">
flowchart TB
    U["用户在职位来源页<br/>粘贴 职位 URL + JD"] --> S["选定适配器（registry）<br/>mock ｜ boss ｜ liepin ｜ zhilian ｜ lagou ｜ job51"]
    S --> N["normalizer 规范化<br/>剥 HTML/压空白/薪资统一/公司去后缀/城市归一"]
    N --> FP["内容指纹 = SHA-256 截 40 位"]

    D1 -->|"未命中"| D2{"二级：内容指纹命中?（跨平台同内容）"}
    D2 -->|"命中"| EX2["EXACT_DUPLICATE"]
    D2 -->|"未命中"| D3{"三级：公司+职位+城市一致但内容不同?"}
    D3 -->|"命中"| PS["POSSIBLE_DUPLICATE（仅提示不合并）"]
    D3 -->|"未命中"| NEW["NEW → 创建 jobs + 公司自动建档"]
    EX2 --> R["返回 {job, dedupe, warnings}<br/>自动用主简历计算匹配度"]
    PS --> R

</script>

<script type="text/plain" id="d8" data-title="8. Agent 投递状态机">
stateDiagram-v2
    [*] --> running: POST /agent/runs（jobId+resumeId）

    state running {
        [*] --> open_page: BrowserDriver.open
        open_page --> login_wall_stop: kind=login_wall（如实上报即停）
        open_page --> job_detail
        job_detail --> click_apply
        click_apply --> captcha_blocked: kind=captcha
        click_apply --> apply_form
        apply_form --> policy_check: 读表单+JD
        policy_check --> policy_reject: REJECT（硬性不满足）
        policy_check --> need_confirm: 软性规则<br/>REQUIRE_USER_CONFIRMATION
        policy_check --> content_gen: ALLOW（白名单/全部满足）
        need_confirm --> content_gen
        content_gen --> fill_form: 打招呼语<br/>useAI=true 走 AI，失败降级 template
        fill_form --> wait_user_confirm: 表单就绪（confirm 前不提交）
    }

    wait_user_confirm --> awaiting_confirmation

    awaiting_confirmation --> submitted: 用户确认 → driver.submit → 成功
    awaiting_confirmation --> failed: 提交失败
    awaiting_confirmation --> rejected_by_user: 用户拒绝
    awaiting_confirmation --> handed_over_to_user: 我自己来投（handover，不可逆）

    captcha_blocked --> awaiting_captcha_check: blocked_reminder_created<br/>自动创建待处理提醒
    awaiting_captcha_check --> running: 用户在平台完成验证后<br/>POST /captcha/resolved 复检（≤2 次，sticky 未通过不重试）
    awaiting_captcha_check --> handed_over_to_user: 接管处理

    login_wall_stop --> handed_over_to_user: 需登录提醒 + 接管
    submitted --> [*]
    failed --> [*]
    rejected_by_user --> [*]
    handed_over_to_user --> [*]
</script>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base", themeVariables: {
    primaryColor: "#edeefe", primaryTextColor: "#15171d", primaryBorderColor: "#d8ddfc",
    lineColor: "#98a0b0", secondaryColor: "#f1f3f7", tertiaryColor: "#f6f7fa",
    fontFamily: 'Inter, "PingFang SC", "Microsoft YaHei", sans-serif', fontSize: "14px",
  }});

  (async () => {
  const srcs = [...document.querySelectorAll('script[type="text/plain"]')].sort((a, b) => parseInt(a.id.slice(1)) - parseInt(b.id.slice(1)));
  const nav = document.getElementById("nav");
  const content = document.getElementById("content");

  for (const s of srcs) {
    const id = s.id;
    const title = s.dataset.title;
    const a = document.createElement("a");
    a.href = `#${id}`; a.textContent = title;
    nav.appendChild(a);

    const sec = document.createElement("section");
    sec.id = id;
    const h2 = document.createElement("h2"); h2.textContent = title;
    const box = document.createElement("div"); box.className = "diagram";
    sec.append(h2, box);
    content.appendChild(sec);

    try {
      if (id === "d2") {
        const pre = document.createElement("pre");
        pre.style.cssText = "font-family:Consolas,'Courier New',monospace;font-size:12.5px;line-height:1.75;color:var(--t2);overflow-x:auto;";
        pre.textContent = s.textContent.trim();
        box.appendChild(pre);
      } else {
        const { svg } = await mermaid.render(`svg-${id}`, s.textContent.trim());
        box.innerHTML = svg;
      }
    } catch (e) {
      const err = document.createElement("div");
      err.className = "err";
      err.textContent = "Mermaid 渲染失败：" + (e?.message ?? e);
      box.appendChild(err);
    }
  }

  // 侧边导航高亮
  const obs = new IntersectionObserver((es) => {
    es.forEach((en) => {
      if (en.isIntersecting) {
        nav.querySelectorAll("a").forEach((x) => x.classList.toggle("active", x.getAttribute("href") === `#${en.target.id}`));
      }
    });
  }, { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll("section").forEach((x) => obs.observe(x));
  })();
</script>
